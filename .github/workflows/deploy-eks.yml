name: Deploy to EKS

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/eks/00-namespace.yaml
          kubectl create secret generic games-api-secrets -n fase4 \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}" \
            --from-literal=jwt-issuer="${{ secrets.JWT_ISSUER }}" \
            --from-literal=jwt-audience="${{ secrets.JWT_AUDIENCE }}" \
            --from-literal=jwt-key-id="${{ secrets.JWT_KEY_ID }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic rabbitmq-secrets -n fase4 \
            --from-literal=rabbitmq-user="${{ secrets.RABBITMQ_USERNAME }}" \
            --from-literal=rabbitmq-pass="${{ secrets.RABBITMQ_PASSWORD }}" \
            --from-literal=rabbitmq-vhost="${{ secrets.RABBITMQ_VHOST }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/eks/02-serviceaccount.yaml
          kubectl annotate serviceaccount games-api eks.amazonaws.com/role-arn="${{ secrets.GAMES_API_ROLE_ARN }}" -n fase4 --overwrite
          kubectl apply -f k8s/eks/03-rabbitmq.yaml
          kubectl apply -f k8s/eks/03-redis.yaml
          kubectl apply -f k8s/eks/03-elasticsearch.yaml
          kubectl apply -f k8s/eks/04-games-api.yaml
          kubectl apply -f k8s/eks/05-service.yaml
          kubectl apply -f k8s/eks/06-hpa.yaml
          kubectl apply -f k8s/eks/07-ingress.yaml

      - name: Deploy image
        run: |
          kubectl set image deployment/games-api games-api=${{ secrets.DOCKER_HUB_REPOSITORY }}:${{ github.sha }} -n fase4
          kubectl rollout status deployment/games-api -n fase4

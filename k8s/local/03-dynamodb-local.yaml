apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
  namespace: fase4
spec:
  type: ClusterIP
  selector:
    app: dynamodb-local
  ports:
  - name: http
    port: 8000
    targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  namespace: fase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb-local
  template:
    metadata:
      labels:
        app: dynamodb-local
    spec:
      containers:
      - name: dynamodb-local
        image: amazon/dynamodb-local:2.5.4
        imagePullPolicy: IfNotPresent
        args:
        - "-jar"
        - "DynamoDBLocal.jar"
        - "-sharedDb"
        - "-inMemory"
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

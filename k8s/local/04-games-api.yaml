apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-api
  namespace: fase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: games-api
  template:
    metadata:
      labels:
        app: games-api
    spec:
      containers:
      - name: games-api
        image: adinteltidev/fase4-games-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: AWS__Region
          value: us-east-1
        - name: AWS__ServiceURL
          value: http://dynamodb-local:8000
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: aws-secret-access-key
        - name: DynamoDb__GamesTable
          value: Games
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: jwt-secret
        - name: Jwt__Issuer
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: jwt-issuer
        - name: Jwt__Audience
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: jwt-audience
        - name: Jwt__KeyId
          valueFrom:
            secretKeyRef:
              name: games-api-secrets
              key: jwt-key-id
        - name: RabbitMq__Host
          value: rabbitmq
        - name: RabbitMq__Port
          value: "5672"
        - name: RabbitMq__Username
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: rabbitmq-user
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: rabbitmq-pass
        - name: RabbitMq__VirtualHost
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: rabbitmq-vhost
        - name: RabbitMq__ExchangeName
          value: fiap.events
        - name: RabbitMq__PaymentQueueName
          value: payment-queue
        - name: Elasticsearch__Url
          value: http://elasticsearch:9200
        - name: Elasticsearch__IndexName
          value: games
        - name: Redis__Host
          value: redis
        - name: Redis__Port
          value: "6379"
        - name: Redis__InstanceName
          value: "games-api:"
        - name: Cache__GamesListKey
          value: games:list
        - name: Cache__GamesListTtlSeconds
          value: "300"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5

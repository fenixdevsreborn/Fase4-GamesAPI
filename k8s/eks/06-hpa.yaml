apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: games-api
  namespace: fase4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: games-api
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
